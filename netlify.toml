# Netlify hosts ONLY the Gemini API endpoint. The app itself stays on GitHub Pages (main branch root).
# Secrets are set in Netlify → Site configuration → Environment variables (scope: Functions), never here.
[build]
  publish = "netlify/public"
  command = "npm test"

[build.environment]
  # index.html carries the Firebase web config apiKey, which is public by design (access is enforced by
  # Firestore rules, not the key). Smart secret detection flags its AIza… shape, so skip that file only.
  # Real secrets stay protected: Netlify still scans every file for the values of secret env vars, and
  # test/gemini.test.mjs fails the build if index.html gains any other API key.
  SECRETS_SCAN_SMART_DETECTION_OMIT_PATHS = "index.html"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
